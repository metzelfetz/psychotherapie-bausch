# Two branches (plan.md, "Two branches, no staging URL"):
# - main is staging: every push only builds the site, as a check.
# - production is live: every push builds and publishes to GitHub Pages.
# Publishing is a fast-forward merge of main into production (README, Deploy).
# Official actions only. SITE_URL and BASE_PATH are optional repo variables;
# without them the build targets https://psychotherapie-bausch.de/.
name: Build and deploy

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
      - if: github.ref_name == 'production'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref_name == 'production'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
